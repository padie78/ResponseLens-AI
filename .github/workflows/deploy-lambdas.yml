name: Deploy Lambdas
on:
  workflow_dispatch:
  push:
    paths:
      - 'libs/**'
      - 'lambda_code/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/deploy-lambdas.sh'
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-monorepo
      - name: Require AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "${AWS_ACCESS_KEY_ID}" ] || [ -z "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "Missing secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY" >&2
            exit 1
          fi
      - name: Build & publish
        run: bash scripts/deploy-lambdas.sh
        env:
          # Prefer repo Variable (no secreto). Fallback: secret legado → eu-central-1
          AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-central-1' }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'eu-central-1' }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          NAME_PREFIX: ${{ vars.NAME_PREFIX || 'responselens-dev' }}
