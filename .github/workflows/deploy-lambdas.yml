name: Deploy Lambdas

on:
  push:
    branches: [main]
    paths:
      - 'libs/**'
      - 'lambda_code/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - 'scripts/deploy-lambdas.sh'
      - '.github/workflows/deploy-lambdas.yml'
  workflow_run:
    workflows: ['Deploy Infrastructure']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lambdas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_LOCKS_TABLE: ${{ vars.TF_STATE_LOCKS_TABLE || 'responselens-tf-locks' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'dev/terraform.tfstate' }}

jobs:
  build:
    name: Build (${{ matrix.artifact }})
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: api/api
            artifact: appsync-api
            tf_output: appsync_api_function_name
          - path: ingestion/competitor_scan
            artifact: competitor-scan
            tf_output: competitor_scan_function_name
          - path: ingestion/mention_webhook
            artifact: mention-webhook
            tf_output: mention_webhook_function_name

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-node-monorepo

      - name: Build libs (tsc)
        run: npx nx run-many --target=build --projects=common,domain,application,infrastructure --parallel=4

      - name: Bundle lambda
        working-directory: lambda_code/${{ matrix.path }}
        run: npm run build

      - name: Zip artifact
        working-directory: lambda_code/${{ matrix.path }}
        run: |
          cd dist
          zip -qr ../${{ matrix.artifact }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}-zip
          path: lambda_code/${{ matrix.path }}/${{ matrix.artifact }}.zip
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy (${{ matrix.artifact }})
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - artifact: appsync-api
            tf_output: appsync_api_function_name
            patch_appsync: false
          - artifact: competitor-scan
            tf_output: competitor_scan_function_name
            patch_appsync: true
          - artifact: mention-webhook
            tf_output: mention_webhook_function_name
            patch_appsync: true

    steps:
      - uses: actions/checkout@v4

      - name: Resolve auth mode
        id: auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin credenciales AWS. Deploy omitido."
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.auth.outputs.mode != 'skip'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false

      - uses: actions/download-artifact@v4
        if: steps.auth.outputs.mode != 'skip'
        with:
          name: ${{ matrix.artifact }}-zip
          path: artifact

      - name: Resolve function name from Terraform output
        id: tf
        if: steps.auth.outputs.mode != 'skip'
        working-directory: infra
        run: |
          set -euo pipefail

          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Falta la repository variable TF_STATE_BUCKET."
            exit 1
          fi

          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCKS_TABLE}" \
            -backend-config="encrypt=true"

          terraform output -json > tf-outputs.json 2> tf-output.err || true
          if ! jq -e 'type == "object" and length > 0' tf-outputs.json >/dev/null 2>&1; then
            cat tf-output.err || true
            echo "::error::Terraform no tiene outputs. Ejecutá primero Deploy Infrastructure."
            exit 1
          fi

          FN_NAME=$(jq -r '.["${{ matrix.tf_output }}"].value // empty' tf-outputs.json)
          if [ -z "$FN_NAME" ] || [ "$FN_NAME" = "null" ]; then
            echo "::warning::Output '${{ matrix.tf_output }}' ausente."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPSYNC_ENDPOINT=$(jq -r '.appsync_endpoint.value // .graphql_endpoint.value // empty' tf-outputs.json)
          APPSYNC_API_KEY=$(jq -r '.appsync_api_key.value // empty' tf-outputs.json)

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "function_name=$FN_NAME" >> "$GITHUB_OUTPUT"
          echo "appsync_endpoint=$APPSYNC_ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "::add-mask::$APPSYNC_API_KEY"
          echo "appsync_api_key=$APPSYNC_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Wait until Lambda is fully provisioned
        if: steps.auth.outputs.mode != 'skip' && steps.tf.outputs.skip != 'true'
        run: |
          aws lambda wait function-active-v2 \
            --function-name "${{ steps.tf.outputs.function_name }}"

      - name: Update Lambda code
        if: steps.auth.outputs.mode != 'skip' && steps.tf.outputs.skip != 'true'
        run: |
          aws lambda update-function-code \
            --function-name "${{ steps.tf.outputs.function_name }}" \
            --zip-file "fileb://artifact/${{ matrix.artifact }}.zip" \
            --publish \
            --no-cli-pager

      - name: Wait until Lambda update is propagated
        if: steps.auth.outputs.mode != 'skip' && steps.tf.outputs.skip != 'true'
        run: |
          aws lambda wait function-updated-v2 \
            --function-name "${{ steps.tf.outputs.function_name }}"

      - name: Patch AppSync publisher environment
        if: >-
          steps.auth.outputs.mode != 'skip'
          && steps.tf.outputs.skip != 'true'
          && matrix.patch_appsync == true
        env:
          FUNCTION_NAME: ${{ steps.tf.outputs.function_name }}
          APPSYNC_ENDPOINT: ${{ steps.tf.outputs.appsync_endpoint }}
          APPSYNC_API_KEY: ${{ steps.tf.outputs.appsync_api_key }}
        run: |
          set -euo pipefail

          if [ -z "$APPSYNC_ENDPOINT" ] || [ -z "$APPSYNC_API_KEY" ]; then
            echo "::error::No se pudieron resolver appsync_endpoint/appsync_api_key desde Terraform."
            exit 1
          fi

          aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query 'Environment.Variables' \
            --output json > current-env.json

          jq \
            --arg url "$APPSYNC_ENDPOINT" \
            --arg key "$APPSYNC_API_KEY" \
            '{Variables: (. + {APPSYNC_GRAPHQL_URL: $url, APPSYNC_API_KEY: $key})}' \
            current-env.json > env-payload.json

          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "file://env-payload.json" \
            --no-cli-pager

          aws lambda wait function-updated-v2 \
            --function-name "$FUNCTION_NAME"

  patch-socialcrawl:
    name: Patch SocialCrawl API key
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Resolve auth mode
        id: auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_DEPLOY_ROLE_ARN}" ]; then echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then echo "mode=keys" >> "$GITHUB_OUTPUT"
          else echo "mode=skip" >> "$GITHUB_OUTPUT"; fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.auth.outputs.mode != 'skip'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false

      - name: Patch SOCIALCRAWL_API_KEY on Lambdas
        if: steps.auth.outputs.mode != 'skip'
        env:
          SOCIALCRAWL_API_KEY: ${{ secrets.SOCIALCRAWL_API_KEY }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${SOCIALCRAWL_API_KEY}" ]; then
            echo "::error::Secret SOCIALCRAWL_API_KEY vacío."
            exit 1
          fi
          export TF_STATE_BUCKET
          bash scripts/patch-socialcrawl-env.sh
