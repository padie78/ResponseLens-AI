name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - 'apps/responselens-web/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_LOCKS_TABLE: ${{ vars.TF_STATE_LOCKS_TABLE || 'responselens-tf-locks' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'dev/terraform.tfstate' }}
  # Angular 19 application builder → browser/
  BUILD_PATH: dist/apps/responselens-web/browser

jobs:
  build-and-deploy:
    name: Build & Sync to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup monorepo
        uses: ./.github/actions/setup-node-monorepo

      - name: Resolve auth mode
        id: auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin credenciales AWS. Se valida el build; deploy omitido."
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.auth.outputs.mode != 'skip'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false

      - name: Resolve infra outputs
        id: tf
        if: steps.auth.outputs.mode != 'skip'
        working-directory: infra
        run: |
          set -euo pipefail

          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Falta la repository variable TF_STATE_BUCKET."
            exit 1
          fi

          terraform init -input=false -no-color \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCKS_TABLE}" \
            -backend-config="encrypt=true"

          terraform output -json > tf-outputs.json 2> tf-output.err || true
          if ! jq -e 'type == "object" and length > 0' tf-outputs.json >/dev/null 2>&1; then
            cat tf-output.err || true
            echo "::error::Terraform no tiene outputs. Ejecutá primero Deploy Infrastructure."
            exit 1
          fi

          BUCKET=$(jq -r '.frontend_bucket.value // empty' tf-outputs.json)
          DIST_ID=$(jq -r '.frontend_cloudfront_id.value // empty' tf-outputs.json)
          CF_DOMAIN=$(jq -r '.frontend_cloudfront_domain.value // empty' tf-outputs.json)
          APPSYNC_ENDPOINT=$(jq -r '.graphql_endpoint.value // empty' tf-outputs.json)
          APPSYNC_API_KEY=$(jq -r '.appsync_api_key.value // empty' tf-outputs.json)
          COGNITO_POOL=$(jq -r '.cognito_user_pool_id.value // empty' tf-outputs.json)
          COGNITO_CLIENT=$(jq -r '.cognito_client_id.value // empty' tf-outputs.json)
          AWS_REGION_OUT=$(jq -r '.aws_region.value // empty' tf-outputs.json)

          if [ -z "$BUCKET" ] || [ -z "$DIST_ID" ] || [ -z "$APPSYNC_ENDPOINT" ] || [ -z "$APPSYNC_API_KEY" ] || [ -z "$COGNITO_POOL" ] || [ -z "$COGNITO_CLIENT" ]; then
            echo "::error::Faltan outputs Terraform (frontend_bucket, frontend_cloudfront_id, graphql_endpoint, appsync_api_key, cognito_*)."
            echo "::error::Aplicá infra con el módulo frontend_hosting y reintentá."
            exit 1
          fi

          {
            echo "bucket=$BUCKET"
            echo "distribution_id=$DIST_ID"
            echo "cloudfront_domain=$CF_DOMAIN"
            echo "appsync_endpoint=$APPSYNC_ENDPOINT"
            echo "cognito_user_pool_id=$COGNITO_POOL"
            echo "cognito_client_id=$COGNITO_CLIENT"
            echo "aws_region=${AWS_REGION_OUT:-$AWS_REGION}"
          } >> "$GITHUB_OUTPUT"
          echo "::add-mask::$APPSYNC_API_KEY"
          echo "appsync_api_key=$APPSYNC_API_KEY" >> "$GITHUB_OUTPUT"

      - name: Inject runtime environment
        if: steps.auth.outputs.mode != 'skip'
        env:
          CF_DOMAIN: ${{ steps.tf.outputs.cloudfront_domain }}
          REGION: ${{ steps.tf.outputs.aws_region }}
        run: |
          set -euo pipefail
          ORIGIN="https://${CF_DOMAIN}"

          cat > apps/responselens-web/src/environments/environment.prod.ts <<EOF
          import type { AppRuntimeEnvironment } from './environment.types';

          export const environment: AppRuntimeEnvironment = {
            production: true,
            appsync: {
              endpoint: '${{ steps.tf.outputs.appsync_endpoint }}',
              region: '${REGION}',
              apiKey: '${{ steps.tf.outputs.appsync_api_key }}',
            },
            cognito: {
              userPoolId: '${{ steps.tf.outputs.cognito_user_pool_id }}',
              userPoolClientId: '${{ steps.tf.outputs.cognito_client_id }}',
              domain: '',
              oauthRedirectSignIn: '${ORIGIN}/auth/callback',
              oauthRedirectSignOut: '${ORIGIN}/login',
            },
          };
          EOF

      - name: Build Angular (production)
        run: npx nx build responselens-web --configuration=production

      - name: Sync immutable assets to S3
        if: steps.auth.outputs.mode != 'skip'
        run: |
          aws s3 sync "${{ env.BUILD_PATH }}/" "s3://${{ steps.tf.outputs.bucket }}/" \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync index.html (no-cache)
        if: steps.auth.outputs.mode != 'skip'
        run: |
          aws s3 cp "${{ env.BUILD_PATH }}/index.html" "s3://${{ steps.tf.outputs.bucket }}/index.html" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        if: steps.auth.outputs.mode != 'skip'
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths "/index.html" "/" \
            --no-cli-pager
