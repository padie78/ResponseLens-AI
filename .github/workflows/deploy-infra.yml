name: Deploy Infrastructure

on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  TF_STATE_LOCKS_TABLE: ${{ vars.TF_STATE_LOCKS_TABLE || 'responselens-tf-locks' }}
  TF_STATE_KEY: ${{ vars.TF_STATE_KEY || 'dev/terraform.tfstate' }}
  TF_IN_AUTOMATION: 'true'
  TF_INPUT: 'false'
  TF_VAR_project_name: ${{ vars.PROJECT_NAME || 'responselens' }}
  TF_VAR_environment: ${{ vars.TF_ENVIRONMENT || 'dev' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_VAR_appsync_graphql_api_name: ${{ vars.APPSYNC_GRAPHQL_API_NAME || 'responselens-api' }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}

jobs:
  terraform:
    name: Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Resolve auth mode
        id: auth
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${AWS_DEPLOY_ROLE_ARN}" ]; then
            echo "mode=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${AWS_ACCESS_KEY_ID}" ] && [ -n "${AWS_SECRET_ACCESS_KEY}" ]; then
            echo "mode=keys" >> "$GITHUB_OUTPUT"
          else
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin credenciales AWS (AWS_DEPLOY_ROLE_ARN o access keys). Infra omitida."
          fi

      - name: Validate Terraform backend variables
        if: steps.auth.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          if [ -z "${TF_STATE_BUCKET}" ]; then
            echo "::error::Falta la repository variable TF_STATE_BUCKET."
            echo "::error::1) Corré una vez: cd infra/bootstrap && terraform apply"
            echo "::error::2) En GitHub → Settings → Variables: TF_STATE_BUCKET=<bucket>"
            echo "::error::   Opcional: TF_STATE_LOCKS_TABLE, TF_STATE_KEY, AWS_REGION"
            exit 1
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.auth.outputs.mode == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (access keys)
        if: steps.auth.outputs.mode == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        if: steps.auth.outputs.mode != 'skip'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.2
          terraform_wrapper: false

      - name: Terraform fmt
        if: steps.auth.outputs.mode != 'skip'
        run: terraform fmt -check -recursive

      - name: Terraform init
        if: steps.auth.outputs.mode != 'skip'
        run: |
          set -euo pipefail
          # -input=false evita el hang pidiendo "bucket" en CI
          terraform init -upgrade -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_STATE_LOCKS_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        if: steps.auth.outputs.mode != 'skip'
        run: terraform validate

      - name: Terraform plan
        if: steps.auth.outputs.mode != 'skip'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        if: steps.auth.outputs.mode != 'skip' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        run: terraform apply -input=false -auto-approve tfplan
