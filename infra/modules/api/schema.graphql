# ResponseLens AI — AppSync GraphQL Schema (API_KEY)
# Patrón de subscriptions alineado con statsGames: Mutation NONE/passthrough + @aws_subscribe.

schema {
  query: Query
  mutation: Mutation
  subscription: Subscription
}

# ─── Enums ───────────────────────────────────────────────────────────────────

enum ReplyTone {
  FORMAL_CORPORATE
  EMPATHETIC
  RESOLUTIVE_TECHNICAL
}

enum AlertSeverity {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

# ─── Company / Config (Users_Config) ─────────────────────────────────────────

type CompetitorProfile {
  name: String!
  aliases: [String!]
  websiteUrl: String
  socialHandles: [String!]
}

type CompanyProfile {
  companyName: String!
  whatTheySell: String!
  keyLinks: [String!]
  brandVoiceNotes: String
}

type UserConfig {
  userId: ID!
  company: CompanyProfile!
  competitors: [CompetitorProfile!]!
  updatedAt: AWSDateTime!
}

input CompetitorProfileInput {
  name: String!
  aliases: [String!]
  websiteUrl: String
  socialHandles: [String!]
}

input CompanyProfileInput {
  companyName: String!
  whatTheySell: String!
  keyLinks: [String!]
  brandVoiceNotes: String
}

input SaveUserConfigInput {
  userId: ID!
  company: CompanyProfileInput!
  competitors: [CompetitorProfileInput!]!
}

# ─── Módulo A: Control de Daños ──────────────────────────────────────────────

enum RiskLevel {
  LOW
  MEDIUM
  HIGH
  CRITICAL
}

enum RecommendedAction {
  PUBLIC_REPLY
  PRIVATE_DM
  ESCALATE_LEGAL
  ESCALATE_SAFETY
  NO_ENGAGE
}

enum EscalationFlag {
  LEGAL_THREAT
  SAFETY_HARM
  DATA_PRIVACY
  CHARGEBACK
  INFLUENCER_REACH
  CHURN_SIGNAL
}

enum AlertWorkflowStatus {
  NEW
  CONTACTED
  SNOOZED
  DISMISSED
  WON
}

type ReplyOption {
  tone: ReplyTone!
  label: String!
  body: String!
  rationale: String
  """True en la opción que la IA recomienda usar primero."""
  recommended: Boolean
}

type ComplaintTriage {
  riskScore: Float!
  riskLevel: RiskLevel!
  escalationFlags: [EscalationFlag!]!
  recommendedAction: RecommendedAction!
  keyIssues: [String!]!
  summary: String!
}

type ReplyOptions {
  complaintId: ID
  sourceUrl: String
  channel: String
  originalText: String!
  options: [ReplyOption!]!
  triage: ComplaintTriage!
  model: String!
  generatedAt: AWSDateTime!
}

input AnalyzeReplyInput {
  userId: ID!
  text: String!
  channel: String
  sourceUrl: String
  complaintId: ID
  companyName: String
  whatTheySell: String
  brandVoiceNotes: String
}

# ─── Módulo B: Conquista Comercial ───────────────────────────────────────────

type CompetitorAlert {
  alertId: ID!
  userId: ID!
  competitorName: String!
  originalComplaint: String!
  sourceUrl: String!
  channel: String
  severity: AlertSeverity!
  frustrationScore: Float
  salesPitch: String!
  detectedAt: AWSDateTime!
  status: AlertWorkflowStatus
  notes: String
  """own = Propios (reputación); rival = Competencia (captación)."""
  brandScope: String
  sentiment: String
  """Origen inbound: mention | brandwatch | meltwater | sprout | zapier | …"""
  inboundSource: String
}

input PublishCompetitorAlertInput {
  alertId: ID!
  userId: ID!
  competitorName: String!
  originalComplaint: String!
  sourceUrl: String!
  channel: String
  severity: AlertSeverity!
  frustrationScore: Float
  salesPitch: String!
  detectedAt: AWSDateTime!
  status: AlertWorkflowStatus
  notes: String
  brandScope: String
  sentiment: String
  inboundSource: String
}

input UpsertCompetitorAlertInput {
  alertId: ID!
  userId: ID!
  competitorName: String!
  originalComplaint: String!
  sourceUrl: String!
  channel: String
  severity: AlertSeverity!
  frustrationScore: Float
  salesPitch: String!
  detectedAt: AWSDateTime!
  status: AlertWorkflowStatus
  notes: String
  brandScope: String
  sentiment: String
  inboundSource: String
}

input UpdateCompetitorAlertInput {
  alertId: ID!
  userId: ID!
  status: AlertWorkflowStatus
  notes: String
}

input AnalyzeRivalReportInput {
  userId: ID!
  competitorName: String!
  mentions: [String!]!
  channel: String
  sourceUrl: String
  companyName: String
  whatTheySell: String
  brandVoiceNotes: String
}

type RivalTheme {
  id: String
  label: String!
}

type RivalReport {
  competitorName: String!
  mentionCount: Int!
  avgFrustration: Float
  riskLevel: RiskLevel
  conclusions: [String!]!
  opportunities: [String!]!
  reportMarkdown: String!
  model: String!
  generatedAt: AWSDateTime!
  themes: [RivalTheme!]
  sources: [String!]
}

# ─── Root operations ─────────────────────────────────────────────────────────

type Query {
  health: String! @aws_api_key @aws_cognito_user_pools

  getUserConfig(userId: ID!): UserConfig @aws_api_key @aws_cognito_user_pools

  listCompetitorAlerts(userId: ID!, limit: Int): [CompetitorAlert!]! @aws_api_key @aws_cognito_user_pools

  """Resultado de un job SocialCrawl async (poll fallback si la subscription no llega)."""
  getSocialCrawlJob(jobId: ID!): SocialCrawlJobResult @aws_api_key @aws_cognito_user_pools
}

type Mutation {
  analyzeReply(input: AnalyzeReplyInput!): ReplyOptions! @aws_api_key @aws_cognito_user_pools

  analyzeRivalReport(input: AnalyzeRivalReportInput!): RivalReport! @aws_api_key @aws_cognito_user_pools

  saveUserConfig(input: SaveUserConfigInput!): UserConfig! @aws_api_key @aws_cognito_user_pools

  """
  Publicada por el cron Lambda de escaneo competitivo.
  Data source NONE (passthrough) — dispara la subscription WebSocket.
  """
  publishCompetitorAlert(input: PublishCompetitorAlertInput!): CompetitorAlert! @aws_api_key @aws_cognito_user_pools

  """
  Persiste la alerta en DynamoDB (y publica realtime si el publisher tiene AppSync).
  Usada por la extensión y por flujos cloud.
  """
  upsertCompetitorAlert(input: UpsertCompetitorAlertInput!): CompetitorAlert! @aws_api_key @aws_cognito_user_pools

  """Actualiza estado / notas del pipeline de captación en DynamoDB."""
  updateCompetitorAlert(input: UpdateCompetitorAlertInput!): CompetitorAlert! @aws_api_key @aws_cognito_user_pools

  """
  Legacy sync (tope AppSync 30s). Preferí startSocialCrawlSearch.
  """
  searchSocialMentions(input: SearchSocialMentionsInput!): SearchSocialMentionsResult!
    @aws_api_key
    @aws_cognito_user_pools

  """
  Encola búsqueda SocialCrawl (SQS). El SPA se suscribe a onSocialCrawlResult(jobId).
  La API key vive solo en el worker Lambda — nunca en el SPA.
  """
  startSocialCrawlSearch(input: StartSocialCrawlSearchInput!): StartSocialCrawlSearchResult!
    @aws_api_key
    @aws_cognito_user_pools

  """
  Publicada por socialcrawl_worker. Data source NONE — dispara onSocialCrawlResult.
  """
  publishSocialCrawlResult(input: PublishSocialCrawlResultInput!): SocialCrawlJobResult!
    @aws_api_key
    @aws_cognito_user_pools
}

input SearchSocialMentionsInput {
  query: String!
  lookbackDays: Int
  """CSV opcional; vacío = default del servidor."""
  sources: String
}

type SearchSocialMentionsResult {
  ok: Boolean!
  error: String
  """JSON array de menciones enriquecidas (id, text, sourceUrl, channel, detectedAt, _scMeta)."""
  mentionsJson: AWSJSON!
  rawCount: Int!
  creditsUsed: Int
  creditsRemaining: Int
  coverage: Float
  planIntent: String
}

input StartSocialCrawlSearchInput {
  query: String!
  lookbackDays: Int
  sources: String
  """Generado por el SPA para suscribirse antes de encolar."""
  jobId: ID
}

type StartSocialCrawlSearchResult {
  jobId: ID!
  status: String!
}

input PublishSocialCrawlResultInput {
  jobId: ID!
  query: String!
  ok: Boolean!
  error: String
  mentionsJson: AWSJSON!
  rawCount: Int!
  creditsUsed: Int
  creditsRemaining: Int
  coverage: Float
  planIntent: String
}

type SocialCrawlJobResult {
  jobId: ID!
  query: String!
  ok: Boolean!
  error: String
  mentionsJson: AWSJSON!
  rawCount: Int!
  creditsUsed: Int
  creditsRemaining: Int
  coverage: Float
  planIntent: String
}

type Subscription {
  onNewCompetitorAlert(userId: ID!): CompetitorAlert
    @aws_subscribe(mutations: ["publishCompetitorAlert"])
    @aws_api_key
    @aws_cognito_user_pools

  onSocialCrawlResult(jobId: ID!): SocialCrawlJobResult
    @aws_subscribe(mutations: ["publishSocialCrawlResult"])
    @aws_api_key
    @aws_cognito_user_pools
}
