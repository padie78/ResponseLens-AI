<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ResponseLens · Share</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <style>
      .share-wrap {
        max-width: 720px;
        margin: 24px auto;
        padding: 0 16px 40px;
      }
      .share-card {
        background: #fff;
        border: 1px solid var(--rl-line, #dbe3ec);
        border-radius: 12px;
        padding: 16px 18px;
        box-shadow: var(--rl-shadow);
      }
      .share-card pre {
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12px;
        line-height: 1.45;
        background: #f8fafc;
        padding: 10px;
        border-radius: 8px;
        max-height: 420px;
        overflow: auto;
      }
      .share-import {
        margin-top: 16px;
      }
      .share-import textarea {
        width: 100%;
        min-height: 72px;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="share-wrap">
      <header class="rl-brand" style="margin-bottom: 16px; display: flex; gap: 10px; align-items: center">
        <img src="icons/icon48.png" alt="" width="36" height="36" />
        <div>
          <strong>ResponseLens · Compartido</strong>
          <div class="rl-muted" id="share-meta" style="font-size: 12px">Cargando…</div>
        </div>
      </header>

      <div id="share-view" class="share-card" hidden></div>
      <p id="share-error" class="rl-status is-error" hidden></p>

      <div class="share-import share-card">
        <h2 style="margin: 0 0 8px; font-size: 14px">Pegar token de share</h2>
        <p class="rl-muted" style="font-size: 12px; margin: 0 0 8px">
          Si te enviaron un token (no un link local), pegalo acá para ver la ficha/oportunidad.
        </p>
        <textarea id="share-token" placeholder="Token base64…"></textarea>
        <button type="button" id="btn-load-token" class="rl-btn rl-btn--primary" style="margin-top: 8px">
          Abrir paquete
        </button>
      </div>
    </div>
    <script type="module" src="share-viewer.js"></script>
  </body>
</html>
